name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/build/ci-diagnostics
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace 2>&1 | tee app/build/ci-diagnostics/android-build.log
      - name: Preserve full unit test report before filtered native renders
        if: always()
        shell: bash
        run: |
          mkdir -p app/build/ci-diagnostics/full-unit-results
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            cp -a app/build/test-results/testDebugUnitTest/. app/build/ci-diagnostics/full-unit-results/
          fi
      - name: Render production version header
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.example.EcosystemHeaderScreenshotTest -Proborazzi.test.record=true --stacktrace
      - name: Render earthquake filter controls and dialogs
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.example.QuakeFilterScreenshotTest -Proborazzi.test.record=true --stacktrace
      - name: Render monitoring pause controls
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.example.monitoring.MonitoringControlScreenshotTest -Proborazzi.test.record=true --stacktrace
      - name: Render automatic Eco notice
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.example.EcoUpdateNoticeScreenshotTest -Proborazzi.test.record=true --stacktrace
      - name: Upload build log and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/ui-shots/*.png
            app/build/reports/lint-results-debug.*
            app/build/ci-diagnostics/android-build.log
            app/build/ci-diagnostics/full-unit-results/
            app/build/outputs/metadata-update-notice.png
            app/build/outputs/ecosystem-version-header*.png
            app/build/outputs/quake-*.png
            app/src/test/screenshots/monitoring_*.png
          if-no-files-found: warn
