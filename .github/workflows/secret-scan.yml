name: Secret pattern scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look for committed keys and tokens
        run: |
          if grep -rIEn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build \
            -e 'AIza[0-9A-Za-z_-]{35}' -e 'ghp_[0-9A-Za-z]{36}' -e 'github_pat_[0-9A-Za-z_]{40,}' \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY' -e 'AKIA[0-9A-Z]{16}' -e 'xox[baprs]-[0-9A-Za-z-]{10,}' \
            -e 'sk_live_[0-9A-Za-z]{20,}' .; then
            echo "Possible secret committed. Remove it and rotate the key."; exit 1
          fi
          echo "No secret patterns found."
